name: engine-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"
          use-public-rspm: true
      - name: Install R packages
        run: Rscript -e "install.packages(c('jsonlite', 'testthat', 'plumber'))"
      - name: Engine unit tests
        run: Rscript tests/run_tests.R
      - name: DARTH validation script
        run: Rscript validation/validate_darth.R
