<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artha HE · Health Economics Workbench</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="Artha HE — health economics workbench (costing, OOP, CEA/CUA/CBA, Markov modeling, PSA, budget impact). Developed by Dr G Hari Prakash.">
<meta name="author" content="Dr G Hari Prakash">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* ============================ TOKENS ============================ */
:root{
  --bg:#F3F2F8; --bg-warm:#EBE9F3; --surface:#FFFFFF; --surface-2:#FAF9FD;
  --ink:#1A1733; --ink-2:#2A2550; --ink-soft:#3A3463;
  --muted:#6E6A86; --muted-light:#8A86A3;
  --primary:#5B4BD6; --primary-bright:#7261F0; --primary-soft:#ECE9FB;
  --gold:#C8971F; --gold-bright:#E0AC3F; --gold-soft:#F7EFD8;
  --emerald:#0E9E78; --emerald-soft:#E0F3EC;
  --amber:#DD9430; --red:#DC4B4B; --red-soft:#FBE9E9;
  --line:#E5E3F0; --line-soft:#EFEEF6;
  --display:'Fraunces',Georgia,serif; --sans:'Plus Jakarta Sans',-apple-system,'Segoe UI',sans-serif; --mono:'Plus Jakarta Sans',-apple-system,'Segoe UI',sans-serif; --code:ui-monospace,'SF Mono',Consolas,monospace;
  --shadow-sm:0 1px 2px rgba(26,23,51,.05); --shadow:0 1px 2px rgba(26,23,51,.04),0 6px 20px rgba(26,23,51,.05);
  --shadow-lg:0 12px 40px rgba(26,23,51,.12); --radius:14px; --rail:212px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;font-size:14.5px;-webkit-font-smoothing:antialiased;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important;}}
::selection{background:var(--primary-soft);}

/* ============================ SHELL ============================ */
.app{display:grid;grid-template-rows:auto 1fr;min-height:100vh;}
header.topbar{background:linear-gradient(110deg,#1A1733 0%,#241F46 60%,#2A2550 100%);color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:relative;}
header.topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--gold) 0%,var(--gold-bright) 30%,transparent 70%);}
.brand{display:flex;align-items:center;gap:12px;padding:13px 0;cursor:pointer;}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,var(--gold-bright),var(--gold));display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;color:#241F46;font-size:19px;box-shadow:0 2px 8px rgba(200,151,31,.35);animation:floaty 5s ease-in-out infinite;}
.brand .name{font-family:var(--display);font-weight:600;font-size:20px;}
.brand .name b{color:var(--gold-bright);font-weight:600;}
.brand .tagline{font-size:11px;color:var(--muted-light);margin-top:1px;}
.topnav{display:flex;gap:2px;background:rgba(255,255,255,.06);padding:4px;border-radius:11px;flex-wrap:wrap;}
.topnav button{font-family:var(--sans);font-weight:600;font-size:12px;color:#B9B5D4;background:transparent;border:none;padding:7px 13px;border-radius:8px;cursor:pointer;transition:all .16s ease;}
.topnav button:hover{color:#fff;background:rgba(255,255,255,.05);}
.topnav button.active{background:var(--primary);color:#fff;box-shadow:0 2px 10px rgba(91,75,214,.4);}
.topnav button.nav-home{color:var(--gold-bright);}
.topnav button.nav-home.active{color:#fff;}
.brand-meta{font-family:var(--mono);font-size:10px;color:var(--muted-light);text-align:right;line-height:1.5;}

.layout{display:grid;grid-template-columns:var(--sbw,46vw) 9px 1fr;min-height:0;}
.layout.full{grid-template-columns:1fr;}
.layout.full .panel-input,.layout.full #dragbar{display:none;}
#dragbar{cursor:col-resize;background:var(--bg-warm);position:relative;transition:background .15s;}
#dragbar::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:3px;height:46px;border-radius:3px;background:var(--muted-light);}
#dragbar:hover,#dragbar.dragging{background:var(--primary-soft);}
#dragbar:hover::before,#dragbar.dragging::before{background:var(--primary);}
@media (max-width:980px){.layout{grid-template-columns:1fr;}#dragbar{display:none;}}

/* ============================ SIDEBAR ============================ */
.panel-input{background:var(--surface);border-right:1px solid var(--line);padding:24px 22px;overflow-y:auto;max-height:calc(100vh - 62px);}
.panel-input h2{font-family:var(--display);font-size:18px;font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:10px;}
.section-num{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--primary);background:var(--primary-soft);padding:3px 8px;border-radius:6px;}
.hint{font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.5;}
.seg{display:flex;gap:3px;margin-bottom:16px;background:var(--bg-warm);border-radius:10px;padding:4px;flex-wrap:wrap;}
.seg button{flex:1;padding:7px 8px;border:none;background:transparent;font-family:var(--sans);font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:7px;transition:all .15s ease;min-width:44px;}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);}
.seg.types button.active{background:var(--primary);color:#fff;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
.field .lab-val{float:right;font-family:var(--mono);color:var(--primary);font-weight:600;text-transform:none;letter-spacing:0;}
.field.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field.two>div label{display:block;font-size:10.5px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
select,textarea,input[type=text],input[type=number]{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;font-family:var(--sans);font-size:13px;background:var(--surface);color:var(--ink);transition:border-color .15s,box-shadow .15s;}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
textarea{resize:vertical;line-height:1.45;}
input[type=range]{width:100%;accent-color:var(--primary);height:5px;}
.divider{height:1px;background:var(--line);margin:20px 0;}
.sublabel{font-size:10.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 9px;}
.start-note{background:var(--primary-soft);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:12px;}
.start-note .sn-title{display:block;font-weight:700;color:var(--primary);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.ex-row{background:var(--surface-2);border:1px dashed var(--line);border-radius:11px;padding:11px 12px;margin-bottom:16px;}
.ex-lab{display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.ex-btns{display:flex;gap:5px;flex-wrap:wrap;}
.ex-btns button{flex:1;min-width:78px;font-family:var(--sans);font-size:11.5px;font-weight:600;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);padding:7px 8px;border-radius:7px;cursor:pointer;transition:all .15s;}
.ex-btns button:hover{border-color:var(--primary);color:var(--primary);}
.ex-btns button.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.ex-note{font-size:11.5px;color:var(--ink-soft);margin-top:9px;line-height:1.45;font-style:italic;}
.wtp-chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.wtp-chips .wchip{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--primary);background:var(--primary-soft);border:1px solid transparent;padding:5px 10px;border-radius:20px;cursor:pointer;transition:all .15s;}
.wtp-chips .wchip:hover{background:var(--primary);color:#fff;}

.grid-wrap{border:1.5px solid var(--line);border-radius:11px;overflow-x:auto;margin-bottom:12px;}
table.data-grid{width:100%;border-collapse:collapse;font-size:11.5px;}
table.data-grid th{background:var(--surface-2);font-family:var(--mono);font-weight:600;text-align:left;padding:8px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;border-bottom:1.5px solid var(--line);white-space:nowrap;}
table.data-grid td{padding:0;border-bottom:1px solid var(--line-soft);}
table.data-grid input,table.data-grid select{border:none;border-radius:0;padding:8px;font-size:13px;font-family:var(--mono);background:transparent;}
table.data-grid select{font-family:var(--sans);font-size:10.5px;}
table.data-grid input:focus{background:var(--primary-soft);box-shadow:none;}
table.data-grid tr:last-child td{border-bottom:none;}
.row-del{width:24px;text-align:center;cursor:pointer;color:var(--muted-light);font-size:14px;}
.row-del:hover{color:var(--red);}

.btn-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.btn{font-family:var(--sans);font-weight:600;font-size:12px;padding:9px 14px;border-radius:9px;border:1.5px solid transparent;cursor:pointer;transition:all .16s ease;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 10px rgba(91,75,214,.28);}
.btn-primary:hover{background:var(--primary-bright);transform:translateY(-1px);}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line);}
.btn-secondary:hover{border-color:var(--muted-light);}
.btn-ghost{background:transparent;color:var(--muted);border-color:var(--line);}
.btn-ghost:hover{background:var(--bg-warm);}
.btn-block{width:100%;justify-content:center;}
.btn.sm{padding:6px 10px;font-size:11px;border-radius:7px;}
.csv-drop{border:2px dashed var(--line);border-radius:11px;padding:14px;text-align:center;font-size:11.5px;color:var(--muted);cursor:pointer;margin-bottom:12px;transition:all .15s;}
.csv-drop:hover{border-color:var(--primary);background:var(--primary-soft);}
.csv-drop input[type=file]{display:none;}

/* checklist (advisor) */
ul.tree,ul.tree ul{list-style:none;margin:0;padding-left:22px;position:relative;}
ul.tree{padding-left:0;}
ul.tree ul::before{content:"";position:absolute;left:8px;top:0;bottom:10px;border-left:1.5px solid var(--line);}
ul.tree li{position:relative;margin:6px 0;}
ul.tree ul>li::before{content:"";position:absolute;left:-14px;top:15px;width:12px;border-top:1.5px solid var(--line);}
.tnode{display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--surface);font-size:12.5px;}
.tnode.leaf{background:var(--surface-2);}
.tnode .tp{font-family:var(--mono);font-size:11px;color:var(--primary);}
.tnode .tc{font-family:var(--mono);font-size:11px;color:var(--gold);}
.tnode .te{font-family:var(--mono);font-size:11px;color:var(--emerald);}
.flow-steps{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
.flow-step{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);}
.flow-step.done{background:var(--surface-2);}
.flow-step .fs-n{flex:0 0 32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--mono);background:var(--primary-soft);color:var(--primary);}
.flow-step.done .fs-n{background:var(--emerald);color:#fff;}
.flow-step .fs-body{flex:1;min-width:0;}
.flow-step .fs-top{font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.flow-step .fs-desc{font-size:12px;color:var(--ink-soft);margin-top:3px;line-height:1.45;}
@media (max-width:640px){.flow-step{flex-wrap:wrap;}.flow-step .btn{width:100%;}}
.checklist{list-style:none;margin:6px 0 0;}
.checklist li{display:flex;gap:9px;align-items:flex-start;font-size:12px;padding:6px 0;color:var(--ink-soft);line-height:1.4;}
.checklist .ok{color:var(--emerald);font-weight:700;}
.checklist .no{color:var(--red);font-weight:700;}
.advisor{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:14px;}
.advisor .rec{font-size:16px;font-weight:600;color:var(--ink);margin:8px 0 2px;font-family:var(--display);}

/* ============================ WORKSPACE ============================ */
.panel-workspace{background:var(--bg);overflow-y:auto;max-height:calc(100vh - 62px);padding:26px 30px;}
.ws-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.ws-head h2{font-family:var(--display);font-size:25px;font-weight:600;color:var(--ink);letter-spacing:-.01em;}
.ws-head .sub{font-size:12.5px;color:var(--muted);margin-top:4px;max-width:620px;line-height:1.55;}
.exp-bar{display:flex;gap:6px;flex-wrap:wrap;}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:13px;margin-bottom:22px;}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line);}
.kpi.accent::before{background:var(--primary);} .kpi.gold::before{background:var(--gold);} .kpi.emerald::before{background:var(--emerald);}
.kpi .k-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;}
.kpi .k-val{font-family:var(--display);font-size:23px;font-weight:600;color:var(--ink);line-height:1.05;}
.kpi .k-val.mono{font-family:var(--mono);font-size:20px;font-weight:600;}
.kpi .k-val.sm{font-size:15.5px;}
.kpi .k-sub{font-size:11px;color:var(--muted-light);margin-top:5px;font-family:var(--mono);}

.result-tabs{display:flex;gap:6px;border-bottom:1.5px solid var(--line);margin-bottom:20px;overflow-x:auto;}
.result-tab{padding:10px 15px;font-family:var(--sans);font-weight:600;font-size:12.5px;color:var(--muted);background:transparent;border:none;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;cursor:pointer;white-space:nowrap;transition:all .15s;}
.result-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
.result-tab:hover:not(.active){color:var(--ink);}
.pane{display:none;} .pane.active{display:block;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;box-shadow:var(--shadow);}
.card h3{font-family:var(--display);font-size:15.5px;font-weight:600;margin-bottom:4px;}
.card .card-sub{font-size:11.5px;color:var(--muted);margin-bottom:16px;line-height:1.5;}
.card.flush{padding:0;overflow:hidden;} .card.flush .pad{padding:20px;}

.table-scroll{overflow-x:auto;}
table.results-table{width:100%;border-collapse:collapse;font-size:13.5px;}
table.results-table th{background:var(--surface-2);font-family:var(--mono);font-weight:600;text-align:right;padding:9px 12px;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;border-bottom:1.5px solid var(--line);}
table.results-table th:first-child,table.results-table td:first-child{text-align:left;}
table.results-table td{padding:9px 12px;text-align:right;font-family:var(--mono);font-size:13px;border-bottom:1px solid var(--line-soft);}
table.results-table tr:last-child td{border-bottom:none;}
table.results-table td:first-child{font-family:var(--sans);font-weight:500;}
table.results-table tfoot td{font-weight:700;border-top:1.5px solid var(--line);background:var(--surface-2);}
.tag{display:inline-block;font-family:var(--sans);font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;}
.tag.frontier{background:var(--emerald-soft);color:var(--emerald);} .tag.dominated{background:var(--red-soft);color:var(--red);} .tag.ext{background:var(--gold-soft);color:#9A7415;}

svg.chart{width:100%;height:auto;display:block;font-family:var(--sans);}
svg.chart rect,svg.chart circle,svg.chart polyline{transition:opacity .12s;}
svg.chart rect:hover{opacity:.82;cursor:pointer;}
svg.chart circle:hover{opacity:.9!important;cursor:pointer;}
svg.chart polyline:hover{cursor:pointer;}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:12px 20px;background:var(--surface-2);border-top:1px solid var(--line);font-size:11px;color:var(--muted);}
.legend .item{display:flex;align-items:center;gap:7px;} .legend .sw{width:13px;height:13px;border-radius:4px;}
.note{font-size:11px;color:var(--muted-light);margin-top:12px;line-height:1.5;font-style:italic;}
.callout{background:var(--primary-soft);border-radius:11px;padding:12px 14px;font-size:12px;color:var(--ink-soft);line-height:1.5;margin-bottom:16px;}
.card.interp{border-left:4px solid var(--gold);background:var(--gold-soft);}
.card.interp h3{color:#8A6712;}
.interp-list{margin:8px 0 0 20px;font-size:14px;line-height:1.62;color:var(--ink-soft);}
.interp-list li{margin-bottom:7px;}
.callout b{color:var(--primary);}

/* ============================ LANDING / HOME ============================ */
#landing{min-height:100vh;}
.lhead{position:sticky;top:0;z-index:30;background:rgba(243,242,248,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:11px 26px;flex-wrap:wrap;gap:10px;}
.lhead .brand{padding:0;cursor:default;}
.lhead .brand .name{color:var(--ink);}
.lhead .brand .tagline{color:var(--muted);}
.home{max-width:1180px;margin:0 auto;padding:18px 22px 40px;}
.hero{position:relative;overflow:hidden;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg);padding:54px 44px;margin-bottom:34px;}
.fluid{position:absolute;inset:0;z-index:0;filter:blur(64px);opacity:.5;pointer-events:none;}
.fluid span{position:absolute;border-radius:50%;mix-blend-mode:multiply;animation:floatblob 19s ease-in-out infinite;}
.fluid .b1{background:var(--primary-bright);width:360px;height:360px;top:-90px;left:-50px;}
.fluid .b2{background:var(--gold-bright);width:320px;height:320px;bottom:-110px;right:8%;animation-delay:-7s;}
.fluid .b3{background:var(--emerald);width:280px;height:280px;top:24%;right:-70px;animation-delay:-13s;}
@keyframes floatblob{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(46px,-34px) scale(1.12);}66%{transform:translate(-34px,24px) scale(.94);}}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
@keyframes spin{to{transform:rotate(360deg);}}
.hero-inner{position:relative;z-index:1;display:flex;gap:34px;align-items:center;flex-wrap:wrap;}
.logo-hero{position:relative;width:118px;height:118px;flex-shrink:0;}
.logo-hero .ring{position:absolute;inset:-9px;border-radius:32px;background:conic-gradient(from 0deg,var(--gold),var(--primary),var(--emerald),var(--gold-bright),var(--gold));animation:spin 9s linear infinite;filter:blur(3px);opacity:.75;}
.logo-hero .tile{position:absolute;inset:0;border-radius:28px;background:linear-gradient(150deg,#241F46,#2A2550);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:60px;color:var(--gold-bright);box-shadow:var(--shadow-lg);animation:floaty 5s ease-in-out infinite;}
.hero h1{font-family:var(--display);font-size:42px;font-weight:600;letter-spacing:-.015em;line-height:1.05;}
.hero h1 b{color:var(--gold);font-weight:600;}
.hero-tag{font-family:var(--display);font-size:19px;font-style:italic;font-weight:500;color:var(--gold);margin-top:8px;letter-spacing:.005em;}
.hero .lead{font-size:16px;color:var(--ink-soft);margin:14px 0 8px;max-width:880px;line-height:1.65;}
.hero .pills{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 22px;}
.pill{font-size:11px;font-weight:600;color:var(--primary);background:var(--primary-soft);padding:5px 12px;border-radius:20px;}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;}
.btn-lg{padding:13px 24px;font-size:14px;border-radius:11px;}

.home h2.sec{font-family:var(--display);font-size:24px;font-weight:600;margin:34px 0 6px;}
.home p.secsub{font-size:13px;color:var(--muted);margin-bottom:20px;max-width:680px;line-height:1.6;}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.step .n{width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;font-family:var(--mono);font-weight:600;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:13px;}
.step h4{font-size:14px;font-weight:700;margin-bottom:5px;}
.step p{font-size:12px;color:var(--muted);line-height:1.5;}
.defs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;}
.def{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 19px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;}
.def:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--primary);}
.def .abbr{font-family:var(--mono);font-size:11px;font-weight:600;color:#fff;background:var(--primary);padding:3px 9px;border-radius:6px;display:inline-block;margin-bottom:9px;}
.def .abbr.gold{background:var(--gold);} .def .abbr.em{background:var(--emerald);} .def .abbr.ink{background:var(--ink);}
.def h4{font-size:13.5px;font-weight:700;margin-bottom:6px;}
.def p{font-size:11.8px;color:var(--muted);line-height:1.55;}
.def .go{font-size:11px;font-weight:600;color:var(--primary);margin-top:10px;display:inline-block;}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:13px;}
.lcard{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow);text-decoration:none;transition:transform .15s,box-shadow .15s,border-color .15s;}
.lcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--primary);}
.lcard .ln{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.lcard .ln .ext{color:var(--primary);font-size:12px;}
.lcard .ld{font-size:12px;color:var(--muted);line-height:1.5;}
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 21px;box-shadow:var(--shadow);}
.gcard h4{font-family:var(--display);font-size:16px;font-weight:600;margin-bottom:12px;color:var(--ink);}
.grow{margin-bottom:11px;}
.glab{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);background:var(--primary-soft);padding:2px 8px;border-radius:5px;margin-bottom:5px;}
.grow p{font-size:13px;color:var(--muted);line-height:1.55;margin:0;}
.gsteps{margin:4px 0 0 18px;font-size:13px;color:var(--ink-soft);line-height:1.5;}
.gsteps li{margin-bottom:3px;}
.method{background:linear-gradient(120deg,#1A1733,#2A2550);color:#E9E7F5;border-radius:20px;padding:34px 38px;margin-top:34px;box-shadow:var(--shadow-lg);}
.method h3{font-family:var(--display);font-size:23px;color:#fff;margin-bottom:10px;}
.method p{font-size:14px;line-height:1.7;color:#CFCBE8;max-width:none;}
.method .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
.method .badge{font-size:11px;font-weight:600;color:var(--gold-bright);background:rgba(224,172,63,.12);padding:6px 13px;border-radius:20px;border:1px solid rgba(224,172,63,.25);}
footer.foot{font-size:11px;color:var(--muted-light);text-align:center;padding:26px;font-family:var(--mono);}

/* ---- topbar tools, tooltips, methods page ---- */
.topbar-tools{display:flex;gap:7px;align-items:center;}
.tbtn{white-space:nowrap;font-family:var(--sans);font-size:11.5px;font-weight:600;color:#CFCBE8;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);padding:6px 11px;border-radius:8px;cursor:pointer;transition:all .15s;}
.tbtn:hover{background:rgba(255,255,255,.15);color:#fff;}
.tbtn.rep{background:var(--gold);color:#241F46;border-color:var(--gold-bright);}
.tbtn.rep:hover{background:var(--gold-bright);color:#241F46;}
abbr.gl{border-bottom:1.5px dotted var(--primary);cursor:help;text-decoration:none;}
.eqgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:15px;margin-bottom:8px;}
.eq{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.eq h4{font-size:13.5px;font-weight:700;margin-bottom:9px;}
.eq .formula{font-family:var(--mono);font-size:12.5px;background:var(--ink);color:#E9E7F5;padding:11px 13px;border-radius:9px;margin-bottom:9px;overflow-x:auto;white-space:nowrap;}
.eq p{font-size:11.5px;color:var(--muted);line-height:1.5;}
.valid-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;}
.valid-row:last-child{border:none;}
.valid-row .vp{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);}
.valid-row .vok{color:var(--emerald);font-weight:700;font-size:15px;}
.valid-row .vno{color:var(--red);font-weight:700;font-size:15px;}
.glossary dl{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:12.5px;margin-top:4px;}
.glossary dt{font-weight:700;color:var(--primary);font-family:var(--mono);font-size:12px;}
.glossary dd{color:var(--ink-soft);line-height:1.5;}

/* ======================= APP SHELL v2 (layout that never squeezes) ======================= */
/* Header: one slim row; tabs scroll sideways instead of wrapping. */
header.topbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding:0 20px;min-height:60px;flex-wrap:nowrap;position:sticky;top:0;z-index:50;}
header.topbar .brand{padding:10px 0;min-width:0;}
.topnav{flex-wrap:nowrap;overflow-x:auto;min-width:0;scrollbar-width:none;scroll-behavior:smooth;justify-self:center;max-width:100%;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 22px),transparent);}
.topnav::-webkit-scrollbar{display:none;}
.topnav button{white-space:nowrap;flex:0 0 auto;position:relative;}
.topnav .sep{flex:0 0 1px;width:1px;align-self:stretch;margin:6px 5px;background:rgba(255,255,255,.16);}
.topnav button.done::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#2BD49F;margin-left:6px;vertical-align:1px;box-shadow:0 0 0 2px rgba(43,212,159,.18);}
.topbar-tools{display:flex;gap:7px;align-items:center;flex-wrap:nowrap;}
@media (max-width:1560px){.brand-meta{display:none;}}
@media (max-width:1700px){header.topbar .brand .tagline{display:none;} .topnav button{padding:7px 10px;}}
@media (max-width:1400px){
  header.topbar{grid-template-columns:auto 1fr;grid-template-areas:"brand tools" "nav nav";column-gap:12px;row-gap:0;padding:0 16px;}
  header.topbar .brand{grid-area:brand;} .topbar-tools{grid-area:tools;justify-self:end;} .topnav{grid-area:nav;justify-self:stretch;margin:0 0 9px;}
}
@media (max-width:560px){
  header.topbar .brand .tagline{display:none;} header.topbar .brand .name{font-size:17px;} header.topbar .brand .logo{width:30px;height:30px;}
  .topbar-tools .tbtn{padding:6px 9px;font-size:11px;white-space:nowrap;}
  .topbar-tools .tbtn .lbl{display:none;}
}

/* Panels fill exactly the space below the header, whatever its height. */
.app{height:100vh;height:100dvh;grid-template-rows:auto minmax(0,1fr);}
.layout{grid-template-columns:var(--sbw,clamp(340px,38vw,560px)) 9px minmax(0,1fr);min-height:0;height:100%;}
.layout.full{grid-template-columns:minmax(0,1fr);}
.panel-input,.panel-workspace{max-height:none;height:100%;min-height:0;overflow-y:auto;overscroll-behavior:contain;}
.panel-workspace{padding:clamp(16px,2.2vw,30px);}
.panel-input{padding:clamp(16px,1.8vw,24px) clamp(14px,1.6vw,22px) 18px;}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
@media (max-width:980px){
  .app{height:auto;min-height:100vh;}
  .layout{height:auto;grid-template-columns:minmax(0,1fr);}
  .panel-input,.panel-workspace{height:auto;overflow:visible;}
  .panel-input{border-right:none;border-bottom:1px solid var(--line);}
}

/* The run button stays reachable at the bottom of long forms. */
.panel-input .divider + .btn-primary.btn-block{position:sticky;bottom:12px;z-index:6;box-shadow:0 0 0 12px var(--surface),0 4px 14px rgba(91,75,214,.28);}
.panel-input .divider{margin-bottom:12px;}

/* Inputs in data grids keep their numbers readable; wide grids scroll. */
table.data-grid input{min-width:72px;}
table.data-grid input[type=checkbox]{min-width:0;}
table.data-grid td:first-child input{min-width:110px;}
.grid-wrap{overflow-x:auto;}
.result-tabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;}
.result-tabs::-webkit-scrollbar{display:none;}
.result-tab{white-space:nowrap;flex:0 0 auto;}
.inline-row{display:flex;gap:8px;align-items:stretch;} .inline-row input{flex:1;min-width:0;} .inline-row .btn{white-space:nowrap;}
.ws-head h2{overflow-wrap:anywhere;}

/* ======================= DESIGN v5 (Clinical Precision + journal figures) ======================= */
body{font-family:var(--sans);font-size:14px;color:var(--ink);font-feature-settings:"cv11","ss01";}
::selection{background:#CCE9E4;}
/* header */
header.topbar{background:#FFFFFF;color:var(--ink);border-bottom:1px solid var(--line);min-height:56px;padding:0 18px;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:none;gap:14px;}
header.topbar::after{display:none;}
header.topbar .brand{grid-area:auto;padding:8px 0;}
header.topbar .brand .logo{width:32px;height:32px;border-radius:8px;background:var(--ink);color:var(--gold-bright);font-family:var(--display);font-size:19px;font-weight:600;box-shadow:none;}
header.topbar .brand .name{font-family:var(--sans);font-weight:700;font-size:16px;letter-spacing:-.02em;color:var(--ink);}
.crumb{min-width:0;color:var(--ink-soft);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.crumb::before{content:"/";color:#94A3B8;margin-right:10px;}
.topbar-tools{grid-area:auto;justify-self:end;}
.savestate{font:400 12px var(--mono);color:var(--muted);padding-right:6px;white-space:nowrap;}
.tbtn{background:#FFFFFF;color:var(--ink);border:1px solid #D5DCE3;border-radius:8px;height:36px;padding:0 12px;font:500 13px var(--sans);display:inline-flex;align-items:center;gap:2px;}
.tbtn:hover{background:var(--bg);color:var(--ink);border-color:#B8C2CC;}
.tbtn.rep{background:var(--primary);border-color:var(--primary);color:#FFFFFF;font-weight:600;padding:0 16px;}
.tbtn.rep:hover{background:var(--primary-bright);color:#FFFFFF;}
@media (max-width:1400px){header.topbar{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:none;padding:0 14px;}}
@media (max-width:760px){.savestate{display:none;}}
@media (max-width:560px){.crumb{display:none;}header.topbar{grid-template-columns:auto 1fr;}}

/* layout: rail | inputs | drag | results */
.layout{grid-template-columns:var(--rail) var(--sbw,clamp(320px,28vw,420px)) 9px minmax(0,1fr);}
.layout.full{grid-template-columns:var(--rail) minmax(0,1fr);}
.rail{background:#FFFFFF;border-right:1px solid var(--line);padding:16px 10px 14px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;min-height:0;}
.rail-prog{padding:2px 10px 14px;}
.rail-prog .rp-lab{font-size:12px;color:var(--muted);}
.rail-prog .rp-bar{height:6px;border-radius:999px;background:var(--line-soft);margin-top:8px;overflow:hidden;}
.rail-prog .rp-bar i{display:block;height:100%;width:0;background:var(--primary);border-radius:999px;transition:width .6s cubic-bezier(.2,.7,.2,1);}
.rail-prog .rp-txt{font:500 12px var(--mono);color:var(--muted);margin-top:6px;}
.rail button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:8px;font:500 13.5px var(--sans);color:var(--ink-soft);cursor:pointer;text-align:left;transition:background .15s,color .15s;}
.rail button:hover{background:var(--bg);color:var(--ink);}
.rail button .n{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid #CBD5E1;display:flex;align-items:center;justify-content:center;font:600 11px var(--mono);color:var(--muted);}
.rail button .n.ic{border-color:transparent;font-size:13px;}
.rail button.done .n{border-color:transparent;background:var(--emerald-soft);color:var(--emerald);font-size:0;}
.rail button.done .n::after{content:"✓";font-size:12px;font-weight:700;}
.rail button.active{background:var(--ink);color:#FFFFFF;}
.rail button.active .n{background:#FFFFFF;border-color:#FFFFFF;color:var(--ink);font-size:11px;}
.rail button.active .n::after{content:none;}
.rail button[data-mod="project"] .n{color:var(--gold);border-color:#E8D3A6;}
.rail button[data-mod="project"].active .n{color:var(--ink);}
.rail-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:2px;}
@media (max-width:1280px){:root{--rail:64px;}.rail{padding:14px 8px;}.rail .lbl,.rail-prog .rp-lab,.rail-prog .rp-txt{display:none;}.rail button{justify-content:center;padding:9px 0;}.rail-prog{padding:2px 4px 12px;}}
@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr);}
  .rail{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:8px 10px;border-right:none;border-bottom:1px solid var(--line);gap:4px;scrollbar-width:none;}
  .rail::-webkit-scrollbar{display:none;}
  .rail .lbl{display:inline;} .rail button{width:auto;flex:0 0 auto;white-space:nowrap;padding:8px 10px;}
  .rail-prog{display:none;} .rail-foot{margin:0;padding:0;border:0;flex-direction:row;}
}

/* panels */
.panel-input{background:#FFFFFF;}
.panel-input h2{font-family:var(--display);font-size:24px;font-weight:500;letter-spacing:-.015em;}
.section-num{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--bg);font-weight:500;}
.field label{font-size:12px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);}
.field.two>div label{font-size:12px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);}
.sublabel{font-size:12px;letter-spacing:.06em;color:var(--ink-soft);}
select,textarea,input[type=text],input[type=number]{border:1px solid #D5DCE3;border-radius:8px;font-family:var(--sans);}
input[type=number],table.data-grid input{font-family:var(--mono);}
select:focus,input:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,75,214,.15);}
.seg{background:#F1F4F7;border-radius:8px;}
.seg button.active{color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.1);}
.seg.types button.active{background:var(--ink);color:#FFFFFF;}
.start-note{background:var(--surface-2);border:1px solid var(--line);}
.start-note .sn-title{color:var(--ink-soft);}
.ex-row{background:var(--surface-2);border:1px dashed #CBD5E1;}
.grid-wrap{border:1px solid var(--line);border-radius:8px;}
table.data-grid th{background:var(--surface-2);}

/* buttons */
.btn{font-weight:600;font-size:13px;border-radius:8px;border-width:1px;}
.btn-primary{background:var(--ink);color:#FFFFFF;box-shadow:none;}
.btn-primary:hover{background:var(--ink-2);transform:none;}
.btn-secondary{border-color:#D5DCE3;}
.btn-secondary:hover{border-color:#94A3B8;background:var(--surface-2);}
.panel-input .divider + .btn-primary.btn-block{height:44px;font-size:14px;box-shadow:0 0 0 12px #FFFFFF,0 6px 16px rgba(15,23,42,.18);}

/* results */
.panel-workspace{background:var(--bg);}
.ws-head h2{font-family:var(--display);font-size:30px;font-weight:500;letter-spacing:-.02em;line-height:1.15;}
.ws-head .sub{color:var(--muted);}
.kpi{border-radius:12px;box-shadow:none;padding:16px 18px;}
.kpi::before{display:none;}
.kpi .k-label{font-size:12px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);margin-bottom:6px;}
.kpi .k-val{font-family:var(--mono);font-weight:600;font-size:24px;letter-spacing:-.02em;}
.kpi .k-val.sm{font-family:var(--sans);font-size:17px;letter-spacing:-.01em;}
.kpi .k-sub{font-family:var(--sans);font-size:12px;color:var(--muted);}
.result-tabs{border-bottom:1px solid var(--line);}
.result-tab{font-weight:500;font-size:13.5px;color:var(--muted);border-bottom-width:2px;}
.result-tab.active{color:var(--ink);border-bottom-color:var(--primary);}
.card{border-radius:12px;box-shadow:none;border:1px solid var(--line);transition:box-shadow .25s,border-color .25s;}
.card:hover{box-shadow:0 14px 30px -22px rgba(15,23,42,.35);}
.card h3{font-family:var(--display);font-size:18px;font-weight:500;letter-spacing:-.01em;}
.card h3 .fig-no{font-weight:600;margin-right:4px;}
.card-sub{color:var(--muted);}
.legend{background:var(--surface-2);border-top:1px solid var(--line-soft);font-size:12px;}
.note{font-style:normal;color:var(--muted);font-size:12px;}
.callout{background:#FFFFFF;border:1px solid var(--line);color:var(--ink-soft);font-size:13px;}
.callout b{color:var(--ink);}
.pill{color:var(--ink-soft);background:var(--bg);}
.tag{font-weight:500;}
/* journal-style tables (booktabs) */
table.results-table{border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);}
table.results-table th{background:transparent;color:var(--ink);font-family:var(--sans);font-weight:600;font-size:12.5px;text-transform:none;letter-spacing:0;border-bottom:1px solid var(--ink);padding:10px 12px;}
table.results-table td{border-bottom:1px solid var(--line-soft);}
table.results-table tfoot td{background:transparent;border-top:1px solid var(--ink);}
/* "How to read this result" */
.card.interp{background:var(--surface-2);border:1px solid var(--line);}
.card.interp h3{font-size:17px;}
/* verdict + checks + scenario pills (calculation screens) */
.verdict{display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:#FFFFFF;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;}
.verdict .vi{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--emerald-soft);color:var(--emerald);}
.verdict.no .vi{background:#FEF3E2;color:var(--amber);}
.verdict .vt{font-family:var(--display);font-size:21px;font-weight:500;letter-spacing:-.01em;}
.verdict .vs{color:var(--muted);margin-top:3px;line-height:1.5;}
.verdict .vb{flex:1 1 360px;min-width:0;}
.scen-pills{display:flex;gap:6px;overflow-x:auto;margin:-4px 0 16px;padding-bottom:2px;scrollbar-width:none;}
.scen-pills::-webkit-scrollbar{display:none;}
.scen-pills button{height:32px;padding:0 13px;border-radius:999px;border:1px solid #D5DCE3;background:#FFFFFF;color:var(--ink-soft);font:500 13px var(--sans);white-space:nowrap;cursor:pointer;transition:border-color .15s,background .15s;}
.scen-pills button:hover{border-color:#94A3B8;}
.scen-pills button.on{background:var(--ink);border-color:var(--ink);color:#FFFFFF;}
.scen-pills button.add{border-style:dashed;color:var(--muted);background:transparent;}
.scen-pills .lab{font-size:12px;color:var(--muted);align-self:center;margin-right:4px;white-space:nowrap;}
.checks-card ul{list-style:none;margin:8px 0 0;display:flex;flex-direction:column;gap:10px;}
.checks-card li{display:flex;gap:10px;line-height:1.45;font-size:13.5px;color:var(--ink-soft);}
.checks-card li .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 auto;background:var(--emerald);}
.checks-card li.warn .dot{background:var(--amber);}
.checks-card li.info .dot{background:#94A3B8;}
/* motion */
@keyframes v5rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.v5-rise{animation:v5rise .6s cubic-bezier(.2,.7,.2,1) both;}
@media (prefers-reduced-motion:reduce){.v5-rise{animation:none;}}
svg.chart{font-family:var(--sans);}
svg.chart text{font-family:var(--sans);}
.sublabel{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--ink);}

/* ======================= LANDING v5 ======================= */
.lp{background:#F6F7F9;color:var(--ink);font-family:var(--sans);font-size:16px;overflow-x:hidden;}
.lp-wrap{max-width:1200px;margin:0 auto;padding-left:28px;padding-right:28px;box-sizing:border-box;}
.lp a{color:var(--primary);}
.lp-nav{position:sticky;top:0;z-index:20;background:rgba(246,247,249,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
.lp-nav-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding-top:12px;padding-bottom:12px;}
.lp-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)!important;font-weight:700;font-size:17px;letter-spacing:-.02em;}
.lp-logo{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--gold-bright);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;font-weight:600;}
.lp-links{display:flex;flex-wrap:wrap;gap:26px;font-size:14px;font-weight:500;}
.lp-links a{color:var(--ink-soft);text-decoration:none;}
.lp-links a:hover{color:var(--ink);}
.lp-btn{border:none;cursor:pointer;font-family:var(--sans);font-weight:600;font-size:14px;border-radius:9px;height:40px;padding:0 18px;display:inline-flex;align-items:center;gap:10px;transition:transform .2s,box-shadow .2s,background .2s,border-color .2s;}
.lp-lg{height:52px;padding:0 26px;font-size:16px;border-radius:10px;}
.lp-dark{background:var(--ink);color:#fff;} .lp-dark:hover{background:var(--ink-2);}
.lp-teal{background:var(--primary);color:#fff;} .lp-teal:hover{transform:translateY(-2px);box-shadow:0 12px 26px -10px rgba(91,75,214,.6);}
.lp-ghost{background:transparent;color:var(--ink);border:1px solid #CBD5E1;font-weight:500;} .lp-ghost:hover{background:#fff;border-color:var(--ink);}
.lp-white{background:#fff;color:var(--ink);} .lp-white:hover{transform:translateY(-2px);}
.lp-hero{background-image:linear-gradient(#E9EDF1 1px,transparent 1px),linear-gradient(90deg,#E9EDF1 1px,transparent 1px);background-size:48px 48px;}
.lp-hero-in{display:flex;flex-wrap:wrap;align-items:center;gap:56px;padding-top:84px;padding-bottom:92px;}
.lp-hero-copy{flex:1 1 440px;min-width:0;}
.lp-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border:1px solid #D5DCE3;border-radius:999px;background:#fff;font-size:13px;color:var(--ink-soft);}
.lp-pulse{width:8px;height:8px;border-radius:50%;background:var(--primary);animation:lpPulse 2.2s infinite;}
.lp h1{font-family:var(--display);font-weight:500;font-size:clamp(40px,5.2vw,64px);line-height:1.03;letter-spacing:-.025em;margin:24px 0 0;}
.lp h1 em{color:var(--primary);}
.lp-lead{font-size:19px;line-height:1.6;color:var(--muted);margin:24px 0 0;max-width:540px;}
.lp-ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px;}
.lp-trust{display:flex;flex-wrap:wrap;gap:16px;margin-top:32px;font-size:13px;color:var(--muted);}
.lp-hero-art{flex:1 1 460px;min-width:0;position:relative;padding:20px 0;}
.lp-window{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 40px 80px -40px rgba(15,23,42,.35);overflow:hidden;}
.lp-win-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line-soft);background:#FAFBFC;font-size:12px;color:var(--muted);}
.lp-win-bar i{width:10px;height:10px;border-radius:50%;background:#E2E8F0;}
.lp-win-bar span{margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lp-win-body{padding:20px 22px;display:flex;flex-direction:column;gap:16px;}
.lp-win-body svg{width:100%;height:auto;}
.lp-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
.lp-mini>div{border:1px solid var(--line-soft);border-radius:10px;padding:12px 14px;}
.lp-mini small{display:block;font-size:11px;color:var(--muted);}
.lp-mini b{display:block;font:600 21px var(--mono);margin-top:4px;letter-spacing:-.02em;}
.lp-tealtxt{color:var(--primary);}
.lp-chip{position:absolute;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 20px 40px -24px rgba(15,23,42,.4);font-size:13px;display:flex;gap:10px;align-items:center;}
.lp-chip small{color:var(--muted);font-size:12px;}
.lp-chip.lp-float{left:-22px;bottom:-6px;}
.lp-chip-dark{right:-12px;top:-4px;display:block;background:var(--ink);color:#fff;border-color:var(--ink);}
.lp-chip-dark small{color:var(--gold-bright);font:500 11px var(--mono);}
.lp-ck{width:26px;height:26px;border-radius:50%;background:var(--emerald-soft);color:var(--emerald);display:flex;align-items:center;justify-content:center;}
.lp-ticker{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;overflow:hidden;}
.lp-ticker-in{display:flex;gap:40px;padding:18px 0;width:max-content;font:500 14px var(--mono);color:var(--muted);white-space:nowrap;animation:lpTicker 48s linear infinite;}
.lp-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:72px;padding-top:0;position:relative;}
.lp-facts::before{content:"";position:absolute;top:0;left:28px;right:28px;height:1px;background:var(--ink);}
@media (max-width:640px){.lp-facts::before{left:16px;right:16px;}}
.lp-facts>div{padding:22px 22px 0;border-left:1px solid var(--line);}
.lp-facts>div:first-child{padding-left:0;border-left:none;}
.lp-facts b{display:block;font:500 44px var(--mono);letter-spacing:-.03em;}
.lp-facts span{display:block;font-size:14px;color:var(--muted);margin-top:6px;line-height:1.5;}
.lp-sec{padding-top:80px;padding-bottom:24px;}
.lp-sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;}
.lp-sec-head p{margin:0;max-width:420px;color:var(--muted);line-height:1.6;}
.lp-eyebrow{font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--primary);}
.lp-gold{color:var(--gold-bright);}
.lp h2{font-family:var(--display);font-weight:500;font-size:clamp(32px,3.6vw,44px);letter-spacing:-.02em;margin:12px 0 0;line-height:1.1;}
.lp-steps{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin-top:48px;}
.lp-line{position:absolute;left:24px;right:24px;top:23px;height:2px;background:var(--primary);opacity:.35;transform-origin:left center;transform:scaleX(0);transition:transform 1.6s cubic-bezier(.2,.7,.2,1) .2s;}
.lp-in .lp-line,.lp-sec:not(.lp-reveal) .lp-line{transform:scaleX(1);}
.lp-step{position:relative;}
.lp-step b{display:block;margin-top:16px;}
.lp-step span{display:block;font-size:14px;color:var(--muted);margin-top:6px;line-height:1.5;}
.lp-num{width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font:600 15px var(--mono);box-sizing:border-box;}
.lp-num.on{background:var(--ink);color:#fff;} .lp-num.end{background:var(--primary);border-color:var(--primary);color:#fff;}
.lp-bento{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-top:40px;padding-bottom:80px;}
.lp-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;transition:transform .28s cubic-bezier(.2,.7,.2,1),box-shadow .28s,border-color .28s;}
.lp-card:hover{transform:translateY(-5px);box-shadow:0 22px 44px -22px rgba(15,23,42,.35);border-color:#C9D2DC;}
.lp-card h3{font-family:var(--display);font-weight:500;font-size:26px;margin:10px 0 0;line-height:1.2;}
.lp-card p{color:var(--muted);line-height:1.6;margin:12px 0 0;}
.lp-span2{grid-column:span 2;display:flex;flex-wrap:wrap;gap:24px;align-items:center;}
.lp-span2>div{flex:1 1 260px;} .lp-span2 svg{flex:1 1 260px;max-width:340px;height:auto;}
.lp-darkcard{background:var(--ink);border-color:var(--ink);color:#fff;} .lp-darkcard p{color:#CBD5E1;}
.lp-band{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.lp-val{display:flex;flex-wrap:wrap;gap:56px;align-items:center;padding-top:80px;padding-bottom:80px;}
.lp-val>div:first-child{flex:1 1 360px;} .lp-val p{color:var(--muted);line-height:1.6;margin:18px 0 0;}
.lp-link{margin-top:18px;background:none;border:none;padding:0;color:var(--primary);font:600 15px var(--sans);cursor:pointer;}
.lp-tablewrap{flex:1 1 520px;min-width:0;overflow-x:auto;}
.lp-table{width:100%;border-collapse:collapse;font-size:14px;min-width:460px;}
.lp-table th{text-align:right;padding:10px;font-weight:600;border-bottom:1px solid var(--ink);} .lp-table th:first-child,.lp-table td:first-child{text-align:left;padding-left:0;font-family:var(--sans);font-size:14px;}
.lp-table td{text-align:right;padding:12px 10px;font:400 13px var(--mono);border-bottom:1px solid var(--line-soft);}
.lp-table td:nth-child(3){color:var(--muted);}
.lp-aud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:32px;margin-bottom:56px;}
.lp-aud b{font-size:18px;}
.lp-final{background:var(--ink);color:#fff;border-radius:24px;padding:64px 48px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:28px;margin-bottom:72px;background-image:radial-gradient(circle at 85% 20%,rgba(91,75,214,.45),transparent 45%);}
.lp-final h2{margin:0;} .lp-final p{color:#CBD5E1;margin:12px 0 0;font-size:17px;}
.lp-foot{border-top:1px solid var(--line);}
.lp-foot .lp-wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-top:28px;padding-bottom:28px;font-size:13px;color:var(--muted);}
@keyframes lpRise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes lpDraw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes lpFade{from{opacity:0}to{opacity:1}}
@keyframes lpFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes lpPulse{0%{box-shadow:0 0 0 0 rgba(91,75,214,.5)}70%{box-shadow:0 0 0 10px rgba(91,75,214,0)}100%{box-shadow:0 0 0 0 rgba(91,75,214,0)}}
@keyframes lpTicker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.lp-rise{animation:lpRise .9s cubic-bezier(.2,.7,.2,1) both;}
.lp-d1{animation-delay:.08s}.lp-d2{animation-delay:.16s}.lp-d3{animation-delay:.24s}.lp-d4{animation-delay:.32s}.lp-d5{animation-delay:.4s}.lp-d6{animation-delay:.48s}.lp-d7{animation-delay:.56s}
.lp-draw{stroke-dasharray:900;animation:lpDraw 2.6s .7s cubic-bezier(.45,0,.2,1) both;}
.lp-late{animation:lpFade 1s 2.4s both;}
.lp-float{animation:lpFloat 6s ease-in-out infinite;} .lp-float2{animation:lpFloat 7s 1.2s ease-in-out infinite;}
.lp-reveal{opacity:0;transform:translateY(28px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);}
.lp-reveal.lp-in{opacity:1;transform:none;}
.lp-reveal .lp-rise{animation-play-state:paused;} .lp-reveal.lp-in .lp-rise{animation-play-state:running;}
@media (max-width:900px){.lp-steps{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:28px;}.lp-line{display:none;}.lp-bento,.lp-aud{grid-template-columns:minmax(0,1fr);}.lp-span2{grid-column:auto;}.lp-facts{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:24px;}.lp-facts>div:nth-child(3){padding-left:0;border-left:none;}}
@media (max-width:640px){.lp-links{display:none;}.lp-hero-in{padding-top:48px;padding-bottom:56px;gap:36px;}.lp-chip.lp-float{left:0;}.lp-chip-dark{right:0;}.lp-final{padding:40px 24px;}.lp-mini b{font-size:17px;}.lp-wrap{padding-left:16px;padding-right:16px;}}
@media (prefers-reduced-motion:reduce){.lp *{animation:none!important;transition:none!important;}.lp-reveal{opacity:1;transform:none;}.lp-line{transform:scaleX(1);}}
button:focus-visible,a:focus-visible,label.tbtn:focus-within,summary:focus-visible,.rail button:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.panel-input .divider + .btn-primary.btn-block::after{content:"Enter ↵";font:500 11px var(--mono);opacity:.55;margin-left:10px;}
/* v5 consistency across every screen */
.start-note .sn-title{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--ink);}
.ex-row .ex-lab{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--ink);}
.panel-input label.btn input[type=file],.panel-input .btn input[type=file]{display:none;}

.card.use-card{background:var(--surface-2);}
.card[style*="border-left"]{border-left:1px solid var(--line)!important;}

/* ======================= THEME · original indigo, violet and gold (v7) ======================= */
body{font-feature-settings:normal;font-variant-numeric:tabular-nums;background:var(--bg);}
::selection{background:#DCD6FA;}
.eq .formula,code,pre{font-family:var(--code);}
/* header: dark indigo gradient with a gold rule */
header.topbar{background:linear-gradient(110deg,#1A1733 0%,#241F46 60%,#2A2550 100%);color:#FFFFFF;border-bottom:3px solid var(--gold);}
header.topbar .brand .logo{background:linear-gradient(150deg,var(--gold-bright),var(--gold));color:#241F46;border-radius:9px;font-family:var(--display);font-weight:700;box-shadow:0 2px 8px rgba(200,151,31,.35);}
header.topbar .brand .name{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:0;color:#FFFFFF;}
header.topbar .brand .name span{color:var(--gold-bright);}
.crumb{color:#CFCBE8;}
.crumb::before{color:#6E6A9A;}
.savestate{font:500 12px var(--sans);color:#9B97B4;}
.tbtn{background:rgba(255,255,255,.07);color:#E9E7F5;border:1px solid rgba(255,255,255,.14);border-radius:9px;font-weight:600;}
.tbtn:hover{background:rgba(255,255,255,.14);color:#FFFFFF;border-color:rgba(255,255,255,.28);}
.tbtn.rep{background:linear-gradient(150deg,var(--gold-bright),var(--gold));border-color:var(--gold);color:#241F46;font-weight:700;}
.tbtn.rep:hover{background:var(--gold-bright);color:#241F46;}
/* step rail */
.rail{background:#FFFFFF;border-right:1px solid var(--line);}
.rail-prog .rp-bar{background:var(--line-soft);}
.rail-prog .rp-bar i{background:linear-gradient(90deg,var(--primary),var(--gold-bright));}
.rail-prog .rp-txt{font:600 12px var(--sans);}
.rail button{border-radius:10px;}
.rail button:hover{background:var(--primary-soft);color:var(--primary);}
.rail button .n{font:700 11px var(--sans);border-color:#D6D2EA;}
.rail button.active{background:var(--primary);color:#FFFFFF;box-shadow:0 4px 14px rgba(91,75,214,.3);}
.rail button.active .n{color:var(--primary);}
.rail button[data-mod="project"] .n{color:var(--gold);border-color:#EAD9AE;}
/* entry panel */
.panel-input h2{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.01em;}
.section-num{font:700 11px var(--sans);color:var(--primary);background:var(--primary-soft);border-radius:6px;padding:3px 8px;}
.field label,.field.two>div label{font-weight:600;color:var(--ink-soft);}
.field .lab-val{font-family:var(--sans);font-weight:700;color:var(--primary);}
select,textarea,input[type=text],input[type=number]{border:1.5px solid var(--line);border-radius:9px;}
input[type=number],table.data-grid input{font-family:var(--sans);}
table.data-grid input[type=number]{min-width:76px;padding:8px 6px;font-size:13px;}
select:focus,input:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,75,214,.15);}
.seg{background:#EFEDF7;border-radius:10px;}
.seg button.active{background:#FFFFFF;color:var(--primary);}
.seg.types button.active{background:var(--primary);color:#FFFFFF;}
.start-note{background:var(--primary-soft);border:1px solid #DCD6FA;border-radius:12px;}
.ex-row{background:var(--surface-2);border:1px dashed #CFC9EC;border-radius:12px;}
.grid-wrap{border:1px solid var(--line);border-radius:10px;}
table.data-grid th{background:var(--surface-2);font:700 10.5px var(--sans);letter-spacing:.04em;color:var(--muted);}
/* buttons */
.btn{border-radius:9px;}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#FFFFFF;box-shadow:0 4px 14px rgba(91,75,214,.3);}
.btn-primary:hover{background:var(--primary-bright);}
.btn-secondary{background:#FFFFFF;border-color:var(--line);color:var(--ink);}
.btn-secondary:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft);}
.panel-input .divider + .btn-primary.btn-block{background:var(--primary);box-shadow:0 0 0 12px #FFFFFF,0 8px 20px rgba(91,75,214,.35);}
.panel-input .divider + .btn-primary.btn-block:hover{background:var(--primary-bright);}
.panel-input .divider + .btn-primary.btn-block::after{font-family:var(--sans);}
/* results */
.ws-head h2{font-family:var(--display);font-weight:600;letter-spacing:-.01em;}
.kpi{background:#FFFFFF;border:1px solid var(--line);border-top:4px solid var(--primary);border-radius:14px;box-shadow:var(--shadow);}
.kpi .k-label{font:700 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);}
.kpi .k-val,.kpi .k-val.mono{font-family:var(--display);font-weight:600;font-size:27px;letter-spacing:-.01em;}
.kpi .k-val.sm{font-family:var(--display);font-size:19px;}
.kpi.gold{border-top-color:var(--gold);}
.kpi.emerald{border-top-color:var(--emerald);}
.kpi.emerald .k-val{color:var(--emerald);}
.result-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
.card{border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow);}
.card h3{font-family:var(--display);font-weight:600;}
.card.interp{background:var(--primary-soft);border-color:#DCD6FA;}
.card.use-card{background:var(--gold-soft);border-color:#EAD9AE;}
.card-sub{font-size:13px;}
.callout{background:var(--primary-soft);border-color:#DCD6FA;border-radius:12px;}
table.results-table{border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);}
table.results-table th{font:700 12px var(--sans);}
table.results-table td{font-family:var(--sans);font-size:13.5px;}
table.results-table tbody tr:hover td{background:var(--surface-2);}
.verdict{background:#FFFFFF;border:1px solid var(--line);border-left:5px solid var(--emerald);border-radius:14px;box-shadow:var(--shadow);}
.verdict .vi{background:var(--emerald-soft);color:var(--emerald);}
.verdict .vt{font-family:var(--display);font-weight:600;}
.verdict.no{border-left-color:var(--amber);}
.verdict.no .vi{background:#FBF0DF;color:var(--amber);}
.verdict.info{border-left-color:var(--primary);}
.verdict.info .vi{background:var(--primary-soft);color:var(--primary);}
.scen-pills button.on{background:var(--primary);border-color:var(--primary);}
.checks-card li .dot{background:var(--emerald);}
svg.chart text{font-family:var(--sans);font-variant-numeric:tabular-nums;}
footer.foot{font-family:var(--sans);}

.lp-chip-dark{background:linear-gradient(110deg,#1A1733,#2A2550);border-color:#2A2550;}
.lp-chip-dark small{color:var(--gold-bright);font:700 11px var(--sans);letter-spacing:.08em;}
.lp-ticker-in{font:600 14px var(--sans);color:var(--ink-soft);}
.lp-ticker-in span::before{content:"✦";color:var(--gold);margin-right:14px;}
.lp-facts::before{background:var(--primary);opacity:.35;}
.lp-facts b{font:600 46px var(--display);color:var(--primary);}
.lp-eyebrow{color:var(--primary);}
.lp h2{font-family:var(--display);font-weight:600;}
.lp-line{background:linear-gradient(90deg,var(--primary),var(--gold));opacity:.6;}
.lp-num{border-color:var(--primary);color:var(--primary);font:700 15px var(--sans);}
.lp-num.on{background:var(--ink);border-color:var(--ink);color:var(--gold-bright);} .lp-num.end{background:var(--primary);border-color:var(--primary);}
.lp-card{border-radius:18px;box-shadow:var(--shadow);}
.lp-card:hover{border-color:#CFC9EC;}
.lp-card h3{font-family:var(--display);font-weight:600;}
.lp-darkcard{background:linear-gradient(150deg,#1A1733,#2A2550);border-color:#2A2550;}
.lp-darkcard p{color:#CFCBE8;}
.lp-table th{border-bottom:2px solid var(--ink);}
.lp-table td{font:400 14px var(--sans);}
.lp-final{background:linear-gradient(110deg,#1A1733 0%,#241F46 60%,#2A2550 100%);background-image:radial-gradient(circle at 85% 20%,rgba(140,120,255,.45),transparent 45%),radial-gradient(circle at 10% 110%,rgba(224,172,63,.35),transparent 45%),linear-gradient(110deg,#1A1733,#2A2550);}
.lp-final p{color:#CFCBE8;}
.lp-white{color:var(--ink);}
.lp-foot{border-top:3px solid var(--gold);}
/* landing: each section in its own coloured block */
.lp-blk{border-top:1px solid var(--line);}
.lp-blk-white{background:#FFFFFF;}
.lp-blk-lav{background:linear-gradient(180deg,#ECE9FB 0%,#F3F1FD 100%);border-top-color:#DCD6FA;}
.lp-blk-plain{background:var(--bg);}
.lp-blk-gold{background:linear-gradient(180deg,#F7EFD8 0%,#FBF6E8 100%);border-top-color:#EAD9AE;}
.lp-blk-last{padding-top:56px;}
.lp-blk .lp-facts{margin-top:0;padding-top:36px;padding-bottom:40px;}
.lp-blk .lp-facts::before{display:none;}
.lp-blk .lp-sec{padding-top:72px;padding-bottom:72px;}
.lp-blk .lp-aud{margin-bottom:0;}
.lp-blk-lav .lp-step{background:#FFFFFF;border:1px solid #DCD6FA;border-radius:14px;padding:16px;box-shadow:var(--shadow-sm);}
.lp-blk-lav .lp-line{top:39px;}
.lp-blk-gold .lp-card{border-color:#EAD9AE;}
.lp-bento{padding-top:72px;padding-bottom:80px;}
.lp-bento-head{grid-column:1/-1;margin-bottom:8px;}
.lp-bento-head h2{margin-top:10px;}
.lp-ticker{border-top:1px solid var(--line);border-bottom:none;background:#FFFFFF;margin-top:24px;}
.lp-band{border-top:1px solid var(--line);border-bottom:none;}
.lp-blk-last .lp-final{margin-bottom:64px;}
@media (max-width:900px){.lp-blk-lav .lp-line{display:none;}}
@media (max-width:640px){.lp-hero-in{padding:34px 20px;margin:0 16px;border-radius:18px;}}
</style>
</head>
<body>
<div id="landing"></div>
<div class="app" id="appShell" style="display:none">
  <header class="topbar">
    <div class="brand" id="brandHome" title="Back to the home page"><div class="logo">अ</div><div class="name">Artha <span>HE</span></div></div>
    <div class="crumb" id="hdrProject" title="Current project">Untitled project</div>
    <div class="topbar-tools">
      <span class="savestate" aria-live="polite">autosaved · v7.0</span>
      <button class="tbtn" id="newProj" title="Start a new, empty project" aria-label="New project">＋<span class="lbl"> New</span></button>
      <button class="tbtn" id="saveProj" title="Save your whole project to a file" aria-label="Save project">⤓<span class="lbl"> Save</span></button>
      <label class="tbtn" title="Load a saved project file" aria-label="Load project">⤒<span class="lbl"> Load</span><input type="file" id="loadProj" accept=".json" hidden></label>
      <button class="tbtn rep" id="reportBtn" title="Generate one combined report of every analysis">Report</button>
    </div>
  </header>
  <div class="layout" id="layout">
    <nav class="rail" id="topnav" aria-label="Analysis steps">
      <div class="rail-prog"><div class="rp-lab">Progress</div><div class="rp-bar"><i id="railBar"></i></div><div class="rp-txt" id="railTxt">—</div></div>
      <button data-mod="project" title="Project"><span class="n">★</span><span class="lbl">Project</span></button>
      <button data-mod="costing" title="Costing"><span class="n">1</span><span class="lbl">Costing</span></button>
      <button data-mod="vb" title="Value Builder"><span class="n">2</span><span class="lbl">Value Builder</span></button>
      <button data-mod="survival" title="Survival"><span class="n">3</span><span class="lbl">Survival</span></button>
      <button data-mod="evaluation" title="Evaluation"><span class="n">4</span><span class="lbl">Evaluation</span></button>
      <button data-mod="modeling" title="Modeling"><span class="n">5</span><span class="lbl">Modeling</span></button>
      <button data-mod="sensitivity" title="Sensitivity"><span class="n">6</span><span class="lbl">Sensitivity</span></button>
      <button data-mod="oop" title="Out-of-pocket"><span class="n">7</span><span class="lbl">Out-of-pocket</span></button>
      <button data-mod="bia" title="Budget impact"><span class="n">8</span><span class="lbl">Budget impact</span></button>
      <div class="rail-foot">
        <button data-mod="reference" title="Reference library"><span class="n ic">◆</span><span class="lbl">Reference library</span></button>
        <button data-mod="methods" title="Methods &amp; validation"><span class="n ic">§</span><span class="lbl">Methods &amp; validation</span></button>
      </div>
    </nav>
    <aside class="panel-input" id="sidebar"></aside>
    <div id="dragbar" title="Drag to resize the entry / results panels"></div>
    <main class="panel-workspace" id="workspace"></main>
  </div>
</div>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<script src="ui.js?v=5.1.1"></script>
